<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bantay Baha</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h1>Bantay Baha</h1>

<div id="statusCard">
  <h2 id="waterLevel">0 cm</h2>
  <p id="status">Normal</p>
</div>

<div class="analytics">
  <div id="avg"></div>
  <div id="min"></div>
  <div id="max"></div>
  <div id="trend"></div>
</div>

<button id="advisoryBtn">
Generate Advisory
</button>

<div id="advisory"></div>

<canvas id="chart"></canvas>

<table>
<thead>
<tr>
<th>Sensor</th>
<th>Level</th>
<th>Time</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script src="js/app.js"></script>

</body>
</html>
